name: CivicAI CI/CD - Test, Scan, and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- STAGE 1: BACKEND TESTING ---
  backend-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Tests
        env:
          MONGODB_URL: mongodb://localhost:27017/civicai
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: "ci-test-secret-12345"
          # We provide dummy keys for providers we skip
          ANTHROPIC_API_KEY: "sk-test"
          GOOGLE_API_KEY: "sk-test"
          GROQ_API_KEY: "sk-test"
          ALIBABA_API_KEY: "sk-test"
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest --ignore=tests/test_ai_providers.py -v -s

  # --- STAGE 2: BACKEND BUILD, SCAN & PUSH ---
  backend-deploy:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/civicai-backend:latest ./backend

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/civicai-backend:latest'
          format: 'table'
          exit-code: '1' # This fails the build if High/Critical vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/civicai-backend:latest

  # --- STAGE 3: FRONTEND BUILD, SCAN & PUSH ---
  frontend-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend Image
        run: |
          docker build \
            --build-arg DOPPLER_TOKEN=${{ secrets.FRONTEND_DOPPLER_TOKEN }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/civicai-frontend:latest ./frontend

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/civicai-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/civicai-frontend:latest
